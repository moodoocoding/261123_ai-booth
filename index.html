<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 체험 부스 · 우리가 만든 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1c2340;--sub:#66709a;--line:#e4e8f6;--pri:#4f5bd5;--gold:#ffb81f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:700;color:var(--ink);min-height:100vh;
  background:radial-gradient(900px 600px at 0% 0%,#dff3ff,transparent 60%),radial-gradient(900px 600px at 100% 0%,#ffe9f1,transparent 60%),radial-gradient(900px 700px at 50% 100%,#fff4cf,transparent 60%),#f6f8ff;
  padding:clamp(14px,2.6vh,30px) clamp(14px,3vw,44px) 40px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
a{color:inherit;text-decoration:none}
.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.wrap{max-width:1500px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-block;background:#fff4cf;color:#9a6a00;padding:6px 16px;border-radius:99px;font-size:15px}
h1{margin:6px 0 4px;font-size:clamp(34px,5vw,64px);line-height:1.08;color:var(--pri)}
h1 em{font-style:normal;color:#ff5d8f}
.lead{margin:0;color:var(--sub);font-weight:500;font-size:clamp(14px,1.5vw,19px)}
.side{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:18px;padding:13px 20px;font-weight:900;font-size:17px;background:#fff;box-shadow:0 5px 0 #d5d9ee;transition:transform .07s,box-shadow .07s;display:inline-block}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d5d9ee}
.btn.gold{background:linear-gradient(135deg,#ffd35c,#ffa41f);color:#4a2c00;box-shadow:0 5px 0 #d98200}
.btn.on{background:var(--pri);color:#fff;box-shadow:0 5px 0 #3a3fa8}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
.f{padding:9px 18px;border-radius:99px;background:#fff;border:2px solid var(--line);font-size:15.5px;transition:all .12s}
.f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.f small{opacity:.6;margin-left:4px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 10px 26px rgba(60,70,140,.13);border:2px solid #fff;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(60,70,140,.2)}
.card:active{transform:translateY(2px)}
.top{position:relative;height:118px;display:grid;place-items:center;font-size:64px;color:#fff}
.top span{filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));transition:transform .2s}
.card:hover .top span{transform:scale(1.12) rotate(-5deg)}
.subj{position:absolute;top:10px;left:10px;font-size:12.5px;background:rgba(255,255,255,.92);color:var(--ink);padding:3px 11px;border-radius:99px}
.body{padding:13px 16px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.body h2{margin:0;font-size:23px;line-height:1.2}
.body p{margin:0;color:var(--sub);font-weight:500;font-size:14.5px;line-height:1.5;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:3px 10px;border-radius:9px;background:#f0f2fb;color:#4a5380}
.tag.rank{background:#fff4cf;color:#9a6a00}.tag.multi{background:#e3f6ff;color:#07679a}
.go{margin-top:4px;text-align:center;border-radius:14px;padding:10px;color:#fff;font-size:17px}
.qrbox{position:absolute;inset:0;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center}
.qrbox div{width:170px;height:170px}.qrbox div img,.qrbox div canvas{width:100%!important;height:100%!important}
.qrbox b{font-size:19px}.qrbox small{color:var(--sub);font-weight:500;font-size:13px}
body.qr .qrbox{display:flex}
.card.hide{display:none}
footer{margin-top:22px;text-align:center;color:var(--sub);font-weight:500;font-size:14px;line-height:1.7}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.step{background:rgba(255,255,255,.8);border:2px solid var(--line);border-radius:18px;padding:11px 14px;font-size:14.5px;color:var(--sub);font-weight:500}
.step b{display:block;color:var(--ink);font-size:17px}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="chip">🎪 2026 충북 AI 페스티벌 · AI 체험 부스</span>
      <h1 class="jua">우리가 만든 <em>게임 <span id="total">13</span>개</em>, 골라서 해 보세요!</h1>
      <p class="lead">초등학생 친구들이 AI와 함께 직접 만든 웹앱이에요. 마음에 드는 카드를 누르면 바로 시작돼요.</p>
    </div>
    <div class="side">
      <a class="btn gold" href="https://moodoocoding.github.io/261123_booth-leaderboard/">🏆 오늘의 랭킹</a>
      <button class="btn" id="qrBtn" onclick="toggleQR()">📱 내 휴대전화로 하기 (QR)</button>
    </div>
  </header>
  <div class="steps">
    <div class="step"><b>① 게임 고르기</b>과목이나 인원수로 골라 볼 수 있어요.</div>
    <div class="step"><b>② 이름 적고 도전</b>🏆 표시가 있는 게임은 기록이 오늘의 랭킹에 올라가요.</div>
    <div class="step"><b>③ 랭킹 확인</b>TV 화면에서 내 이름을 찾아보세요!</div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <footer>게임을 하다가 이 화면으로 돌아오려면 브라우저의 ← 뒤로 가기를 누르세요.<br>모든 게임은 학생이 만든 원작의 아이디어를 살려 다듬었습니다.</footer>
</div>

<script>
// 부스 게임 목록: 여기에 한 줄을 더하면 카드가 늘어나요
// [아이콘, 이름, 한 줄 소개, 분류, 인원, 랭킹 여부, 주소, 색 두 가지]
const GAMES = [
 ['✏️','띄어쓰기 1등은 누구?','글자 사이를 눌러 알맞게 띄어 써요. 화면을 나눠 최대 4명이 동시에 겨뤄요.','국어','1~4명',1,'https://moodoocoding.github.io/261123_spacing-champion/','#ff8a5c','#ff5d8f'],
 ['🥋','수학격투','곱셈 문제를 풀어 필살기를 날리는 격투 게임. 둘이서 화면을 나눠 대결할 수 있어요.','수학','1~2명',1,'https://moodoocoding.github.io/261123_math-fighter/','#ffb23c','#f0561f'],
 ['🏰','구구단 가디언즈','구구단을 맞혀 금화를 모으고 탑을 세워 성을 지키는 타워 디펜스.','수학','1명',1,'https://261123-gugudan-guardians.vercel.app/','#8a7bff','#4f5bd5'],
 ['🚀','우주정복자','태양계 여덟 행성을 돌며 퀴즈를 풀고 우주정복자 임명장을 받아요.','과학','1명',1,'https://moodoocoding.github.io/261123_space-conqueror/','#3a2f8f','#0f1440'],
 ['🌤️','꼬마 기상청장','해, 비, 눈, 바람을 직접 바꿔 보며 날씨를 알아보는 시뮬레이터.','과학','1명',0,'https://moodoocoding.github.io/261123_weather-simulator/','#5cc8ff','#3d8bff'],
 ['🗺️','나라 수도 맞추기','세계 50개 나라의 사진과 국기를 보고 수도를 맞히는 퀴즈.','사회','1명',1,'https://moodoocoding.github.io/261123_capital-quiz/','#34d399','#0ea5a0'],
 ['🎤','트리플 퀴즈 쇼','상식, 연산, 아재개그 세 라운드 퀴즈 쇼. 둘이서 빨리 맞히기 대결도 돼요.','퀴즈','1~2명',1,'https://moodoocoding.github.io/261123_triple-quiz-show/','#ff6fb1','#b44dff'],
 ['🏃','퀴즈 & 점프 런너','장애물을 뛰어넘고 퀴즈를 맞혀 부스트! 최대 4명이 동시에 달려요.','퀴즈','1~4명',1,'https://moodoocoding.github.io/261123_quiz-runner/','#ff9a3d','#e0452f'],
 ['🧠','브레인 대시','색깔 판별, 암산, 기억력 게임을 20초씩! 딱 1분 두뇌 트레이닝.','두뇌','1명',1,'https://moodoocoding.github.io/261123_brain-dash/','#3de0ff','#7a5cff'],
 ['🧩','블록 퍼즐 챔피언','8×8 판에 블록을 놓아 줄을 맞춰 지우는 퍼즐.','두뇌','1명',1,'https://moodoocoding.github.io/261123_block-puzzle/','#7dd87d','#2aa46b'],
 ['🪢','휙휙! 로프 스윙','로프를 걸고 휙휙 날아서 다섯 스테이지를 건너가요.','액션','1명',1,'https://moodoocoding.github.io/261123_rope-swing/','#5ad1c0','#2a7fd6'],
 ['🎧','비트스매시 클럽','음악에 맞춰 떨어지는 노트를 딱 맞게 누르는 리듬 게임.','액션','1명',1,'https://moodoocoding.github.io/261123_beat-smash/','#ff5dc8','#6a3dff'],
 ['⚡','택티컬 코어 디펜스','몰려오는 드론을 막아 코어를 지키는 슈팅 게임. 10 웨이브에 도전!','액션','1명',1,'https://moodoocoding.github.io/261123_core-defense/','#1fd4ff','#1b3a8f']
].map(a=>({ico:a[0],name:a[1],desc:a[2],subj:a[3],players:a[4],rank:!!a[5],url:a[6],c1:a[7],c2:a[8]}));

const $ = id=>document.getElementById(id);
$('total').textContent = GAMES.length;
const FILTERS = [['all','전체',()=>true],...[...new Set(GAMES.map(g=>g.subj))].map(s=>[s,s,g=>g.subj===s]),['multi','👫 여럿이 함께',g=>g.players!=='1명']];
let cur = 'all';
function renderFilters(){
  $('filters').innerHTML = FILTERS.map(([k,label,fn])=>`<button class="f ${k===cur?'on':''}" onclick="setFilter('${k}')">${label}<small>${GAMES.filter(fn).length}</small></button>`).join('');
}
function setFilter(k){
  cur = k; renderFilters();
  const fn = FILTERS.find(f=>f[0]===k)[2];
  document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('hide',!fn(GAMES[i])));
  try{ localStorage.setItem('booth-home-filter',k); }catch(e){}
}
$('grid').innerHTML = GAMES.map((g,i)=>`<a class="card" href="${g.url}">
  <div class="top" style="background:linear-gradient(135deg,${g.c1},${g.c2})"><span>${g.ico}</span><b class="subj">${g.subj}</b></div>
  <div class="body">
    <h2 class="jua">${g.name}</h2><p>${g.desc}</p>
    <div class="tags"><span class="tag ${g.players!=='1명'?'multi':''}">👤 ${g.players}</span>${g.rank?'<span class="tag rank">🏆 오늘의 랭킹</span>':''}</div>
    <div class="go jua" style="background:linear-gradient(135deg,${g.c1},${g.c2})">시작하기 ▶</div>
  </div>
  <div class="qrbox"><b class="jua">${g.ico} ${g.name}</b><div id="qr${i}"></div><small>휴대전화 카메라로 찍어 보세요</small></div>
</a>`).join('');
// QR 보기: 켜면 카드마다 QR 코드가 나와요 (처음 켤 때 한 번만 그려요)
let qrMade = false;
function toggleQR(){
  if(!qrMade){
    qrMade = true;
    GAMES.forEach((g,i)=>{ try{ new QRCode($('qr'+i),{text:g.url,width:340,height:340,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ $('qr'+i).textContent = g.url; } });
  }
  const on = document.body.classList.toggle('qr');
  $('qrBtn').classList.toggle('on',on); $('qrBtn').textContent = on ? '🎮 이 화면에서 하기' : '📱 내 휴대전화로 하기 (QR)';
}
// QR을 보는 동안에는 카드를 눌러도 게임으로 넘어가지 않아요
$('grid').addEventListener('click',e=>{ if(document.body.classList.contains('qr')) e.preventDefault(); });
renderFilters();
try{ const k = localStorage.getItem('booth-home-filter'); if(k && FILTERS.some(f=>f[0]===k)) setFilter(k); }catch(e){}
</script>
</body>
</html>
