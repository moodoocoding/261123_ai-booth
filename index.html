<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 충북 AI 페스티벌 · AI 체험 부스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #111827;
  --sub: #4b5563;
  --muted: #6b7280;
  --line: #e5e7eb;
  --primary: #2563eb;
  --primary-soft: #eff6ff;
  --gold: #f59e0b;
  --radius-card: 20px;
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background-color: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.45;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
}

button {
  cursor: pointer;
}

/* Sticky Booth Kiosk Header */
.kiosk-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}

.header-inner {
  max-width: 1560px;
  margin: 0 auto;
  padding: 14px clamp(16px, 2.5vw, 36px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563eb, #4f46e5);
  color: #ffffff;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 900;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  flex-shrink: 0;
}

.brand-titles {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand-sub {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.01em;
}

.brand-main {
  margin: 0;
  font-size: clamp(18px, 1.6vw, 22px);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--ink);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.live-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 13px;
  border-radius: 99px;
  background: #f8fafc;
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  color: var(--sub);
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
}

.live-stat-pill b {
  color: var(--ink);
  font-weight: 800;
}

.kiosk-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 16px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 700;
  border: 1px solid var(--line);
  background: #ffffff;
  color: var(--ink);
  transition: all 0.15s ease;
}

.kiosk-btn:hover {
  background: #f9fafb;
  border-color: #cbd5e1;
  transform: translateY(-1px);
}

.kiosk-btn.active {
  background: var(--ink);
  color: #ffffff;
  border-color: var(--ink);
}

.kiosk-btn.rank {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  border-color: transparent;
  color: #111827;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.28);
}

.kiosk-btn.rank:hover {
  filter: brightness(1.03);
  box-shadow: 0 6px 16px rgba(245, 158, 11, 0.38);
}

/* Main Workspace */
.container {
  max-width: 1560px;
  margin: 0 auto;
  padding: 20px clamp(16px, 2.5vw, 36px) 56px;
}

/* Subbar: Category Tabs + Search */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.filters {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.filter-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 15px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 700;
  background: #ffffff;
  color: var(--sub);
  border: 1px solid var(--line);
  transition: all 0.14s ease;
}

.filter-tab:hover {
  border-color: #cbd5e1;
  color: var(--ink);
}

.filter-tab.on {
  background: var(--ink);
  color: #ffffff;
  border-color: var(--ink);
  box-shadow: 0 4px 10px rgba(17, 24, 39, 0.15);
}

.filter-tab span {
  font-size: 12px;
  font-weight: 800;
  opacity: 0.65;
}

.search-wrap {
  position: relative;
  min-width: 230px;
  flex: 0 1 280px;
}

.search-wrap input {
  width: 100%;
  height: 38px;
  padding: 0 14px 0 36px;
  border-radius: 99px;
  background: #ffffff;
  border: 1px solid var(--line);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.search-wrap input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.search-ico {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  color: var(--muted);
  pointer-events: none;
}

/* 4-Column Game Launcher Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.game-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: var(--radius-card);
  border: 1px solid var(--line);
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(17, 24, 39, 0.04);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
}

.game-card:hover {
  transform: translateY(-5px);
  border-color: #93c5fd;
  box-shadow: 0 18px 36px -10px rgba(17, 24, 39, 0.13);
}

.game-card:active {
  transform: translateY(-1px);
}

.game-card.hide {
  display: none;
}

/* Top Real Screenshot Preview Frame */
.thumb-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: #0f172a;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}

.thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}

.game-card:hover .thumb-wrap img {
  transform: scale(1.04);
}

/* Floating Badges on Thumbnail */
.thumb-badges {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}

.badge-num {
  padding: 4px 9px;
  border-radius: 8px;
  background: rgba(17, 24, 39, 0.78);
  backdrop-filter: blur(6px);
  color: #ffffff;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.badge-players {
  padding: 4px 10px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  color: #111827;
  font-size: 12px;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
}

.badge-players.multi {
  background: #fef08a;
  color: #713f12;
}

.play-hover-pill {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 2;
  padding: 7px 14px;
  border-radius: 99px;
  background: var(--primary);
  color: #ffffff;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.game-card:hover .play-hover-pill {
  opacity: 1;
  transform: translateY(0);
}

/* Inline QR Layer when "QR 코드 보기" mode is toggled */
.inline-qr-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.inline-qr-box {
  width: 138px;
  height: 138px;
  padding: 8px;
  background: #ffffff;
  border-radius: 14px;
  border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
}

.inline-qr-box img, .inline-qr-box canvas {
  width: 100% !important;
  height: 100% !important;
}

.inline-qr-overlay span {
  font-size: 12px;
  font-weight: 700;
  color: var(--sub);
}

body.qr-all .inline-qr-overlay {
  display: flex;
}

/* Card Body */
.card-body {
  padding: 15px 17px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.card-head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-group {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.subj-chip {
  font-size: 11.5px;
  font-weight: 800;
  padding: 2.5px 8px;
  border-radius: 6px;
  flex-shrink: 0;
}

.card-title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.qr-icon-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: #f3f4f6;
  color: var(--sub);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 800;
  flex-shrink: 0;
  transition: background 0.14s, color 0.14s;
}

.qr-icon-btn:hover {
  background: var(--ink);
  color: #ffffff;
}

.card-desc {
  margin: 0;
  font-size: 13.5px;
  color: var(--sub);
  line-height: 1.48;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}

/* Optional "이렇게 체험해 보세요" Tip Box */
.card-tip {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12px;
  color: #334155;
  line-height: 1.42;
}

.card-tip b {
  color: var(--primary);
  font-weight: 800;
  margin-right: 4px;
}

/* Live Top 1 Mini Footer inside Card */
.card-rank-bar {
  margin-top: 2px;
  padding-top: 9px;
  border-top: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}

.rank-who {
  color: var(--muted);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rank-who b {
  color: var(--ink);
  font-weight: 800;
}

.rank-val {
  color: #d97706;
  font-weight: 800;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Single QR Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 20px;
}

.modal-backdrop.open {
  display: flex;
}

.modal-card {
  background: #ffffff;
  border-radius: 22px;
  padding: 26px 24px 22px;
  max-width: 310px;
  width: 100%;
  text-align: center;
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
}

.modal-card h3 {
  margin: 0 0 4px;
  font-size: 18px;
  font-weight: 800;
}

.modal-card p {
  margin: 0 0 16px;
  font-size: 13px;
  color: var(--muted);
}

.modal-qr {
  width: 184px;
  height: 184px;
  margin: 0 auto 18px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
}

.modal-qr img, .modal-qr canvas {
  width: 100% !important;
  height: 100% !important;
}

.modal-close {
  width: 100%;
  height: 40px;
  border-radius: 10px;
  background: #f3f4f6;
  color: var(--ink);
  font-weight: 700;
  font-size: 14px;
}

.modal-close:hover {
  background: #e5e7eb;
}

@media (max-width: 720px) {
  .grid {
    grid-template-columns: 1fr;
  }
  .search-wrap {
    flex: 1 1 100%;
  }
}
</style>
</head>
<body>

<header class="kiosk-header">
  <div class="header-inner">
    <a class="brand-group" href="./">
      <div class="brand-mark">AI</div>
      <div class="brand-titles">
        <span class="brand-sub">2026 충북 AI 페스티벌 · 청주소로초 디지털 마스터</span>
        <h1 class="brand-main">우리가 만든 AI 웹앱 &amp; 게임 <span id="totalTitleCount">16</span>선</h1>
      </div>
    </a>
    <div class="header-right">
      <div class="live-stat-pill">
        <span class="live-dot"></span>
        <span>오늘 부스 도전 <b id="todayTotalPlays">0</b>회</span>
      </div>
      <button type="button" class="kiosk-btn" id="qrModeBtn" onclick="toggleAllQR()">
        <span>📱</span>
        <span>전체 QR 코드</span>
      </button>
      <a class="kiosk-btn rank" id="rankBtn" href="./leaderboard/">
        <span>🏆</span>
        <span>오늘의 랭킹 보드</span>
      </a>
    </div>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input type="search" id="searchInput" placeholder="게임·웹앱 이름 또는 분류 검색…" oninput="onSearch(this.value)">
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<!-- 개별 QR 모달 -->
<div class="modal-backdrop" id="qrModal" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <h3 id="modalTitle">게임 이름</h3>
    <p>휴대전화 카메라로 스캔하면 바로 시작됩니다</p>
    <div class="modal-qr" id="modalQRBox"></div>
    <button type="button" class="modal-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<script src="./board.js" onerror="window.__noLocalBoard=true"></script>
<script>
const IS_GITHUB = location.hostname.endsWith('github.io');
document.getElementById('rankBtn').href = IS_GITHUB
  ? 'https://moodoocoding.github.io/261123_booth-leaderboard/'
  : './leaderboard/';

const SUBJ_STYLE = {
  '창작': { bg: '#fce7f3', fg: '#db2777' },
  '소통': { bg: '#dbeafe', fg: '#1d4ed8' },
  '국어': { bg: '#ffe4e6', fg: '#e11d48' },
  '수학': { bg: '#fef3c7', fg: '#d97706' },
  '과학': { bg: '#e0f2fe', fg: '#0284c7' },
  '사회': { bg: '#d1fae5', fg: '#059669' },
  '퀴즈': { bg: '#fae8ff', fg: '#9333ea' },
  '두뇌': { bg: '#e0e7ff', fg: '#4f46e5' },
  '액션': { bg: '#fee2e2', fg: '#dc2626' }
};

// 16개 웹앱 & 게임 목록 (실제 첫 화면 캡처 썸네일 + 체험 팁 + 실시간 랭킹 연동)
const GAMES = [
  {
    id: 'mongle',

    desc: '색연필, 형광펜, 도형과 도장으로 그림을 그리고 이야기를 남기는 앱입니다. 완성한 일기는 파일로 저장할 수 있어요.',
    tip: '기억에 남는 장면을 그리고 제목과 짧은 이야기를 붙여 저장해 보세요.',
    subj: '창작',
    players: '1명',
    slug: null,
    extUrl: 'https://mongle-picture-diary.vercel.app/',
    col: null,
    tagLabel: '🎨 그림일기 창작 & 파일 저장'
  },
  {
    id: 'question',
    name: '질문 모아 주세요',
    desc: '항상 똑같은 질문에 지쳐가는 우리 선생님을 위한 공간! 궁금한 것을 자유롭게 질문하고 공감해 보세요.',
    tip: '질문을 남기거나 친구 질문에 공감(✋)을 누르고 선생님 답변을 확인해 보세요.',
    subj: '소통',
    players: '여럿이 함께',
    slug: null,
    extUrl: 'https://261122-question-box.vercel.app/',
    col: null,
    tagLabel: '🙋 우리 반 실시간 질문 & 공감'
  },
  {
    id: 'stairs',
    name: '무한의 계단',
    desc: '휴대폰·태블릿을 좌우로 기울여 계단을 오르는 게임입니다. 방향을 살피며 한 계단씩 최고 기록에 도전하세요!',

    subj: '액션',
    players: '1명 · 모바일/태블릿',
    slug: null,
    extUrl: 'https://2026-11-23-infinite-stairs-tilt.vercel.app/',
    col: null,
    tagLabel: '🏃 기울기 센서 액션 · 세계 공용 순위표'
  },
  {
    id: 'spacing',
    name: '띄어쓰기 1등은 누구?',
    desc: '글자 사이를 눌러 알맞게 띄어 써요. 한 화면을 나눠 최대 4명이 동시에 스피드 대결을 펼칩니다.',
    tip: '인원(1~4명)과 별명을 적고, 띄어 써야 할 글자 사이(∨)를 터치해 제출하세요.',
    subj: '국어',
    players: '1~4명',
    slug: 'spacing-champion',
    extUrl: 'https://moodoocoding.github.io/261123_spacing-champion/',
    col: 'spacing',
    sortFn: (a, b) => (b.c / b.n - a.c / a.n) || (b.c - a.c) || (a.t - b.t),
    fmtScore: r => `${r.c}/${r.n}문제 (${Math.round(r.c / r.n * 100)}%)`
  },
  {
    id: 'fight',
    name: '수학격투',
    desc: '곱셈 문제를 빠르게 풀어 필살기를 날리는 격투 게임! 1인 도전과 2인 화면 분할 대결을 지원합니다.',

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('totalTitleCount').textContent = GAMES.length;

const isMultiPlayer = g => g.players.includes('~') || g.players.includes('여럿');
const isFreeApp = g => !g.col;

const FILTERS = [
  ['all', '전체', () => true],
  ['rank', '🏆 랭킹 도전 게임', g => !!g.col],
  ['free', '✨ 자유 체험 앱', isFreeApp],
  ['multi', '👫 친구와 함께', isMultiPlayer],
  ...[...new Set(GAMES.map(g => g.subj))].map(s => [s, s, g => g.subj === s])
];

let curFilter = 'all';
let searchQ = '';

function renderFilters() {
  $('filters').innerHTML = FILTERS.map(([k, label, fn]) =>
    `<button type="button" class="filter-tab ${k === curFilter ? 'on' : ''}" onclick="setFilter('${k}')">
      ${label}<span>${GAMES.filter(fn).length}</span>
    </button>`
  ).join('');
}

function setFilter(k) {
  curFilter = k;
  renderFilters();
  applyFilters();
  try {
    const url = new URL(location.href);
    if (k === 'all') url.searchParams.delete('tab');
    else url.searchParams.set('tab', k);
    history.replaceState(null, '', url);
  } catch (e) {}
}

function onSearch(val) {
  searchQ = (val || '').trim().toLowerCase();
  applyFilters();
}

function applyFilters() {
  const fn = FILTERS.find(f => f[0] === curFilter)[2];
  document.querySelectorAll('.game-card').forEach((el, i) => {
    const g = GAMES[i];
    const ok = fn(g) && (!searchQ ||
      g.name.toLowerCase().includes(searchQ) ||
      g.desc.toLowerCase().includes(searchQ) ||
      (g.tip && g.tip.toLowerCase().includes(searchQ)) ||
      g.subj.toLowerCase().includes(searchQ));
    el.classList.toggle('hide', !ok);
  });
}

function fullUrl(u) {
  try { return new URL(u, location.href).href; } catch (e) { return u; }
}

$('grid').innerHTML = GAMES.map((g, i) => {
  const isMulti = isMultiPlayer(g);
  const st = SUBJ_STYLE[g.subj] || { bg: '#f3f4f6', fg: '#374151' };
  const numStr = String(i + 1).padStart(2, '0');
  return `
    <a class="game-card" href="${g.url}">
      <div class="thumb-wrap">
        <div class="thumb-badges">
          <span class="badge-num">#${numStr}</span>
          <span class="badge-players ${isMulti ? 'multi' : ''}">${isMulti ? '👫 ' : '👤 '}${g.players}</span>
        </div>
        <img src="${g.thumb}" alt="${esc(g.name)} 첫 화면" loading="${i < 8 ? 'eager' : 'lazy'}">
        <span class="play-hover-pill">바로 시작 ▶</span>
        <div class="inline-qr-overlay">
          <div class="inline-qr-box" id="inline-qr-${i}"></div>
          <span>휴대전화 카메라로 스캔</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-head-row">
          <div class="title-group">
            <span class="subj-chip" style="background:${st.bg};color:${st.fg}">${g.subj}</span>
            <h2 class="card-title">${g.name}</h2>
          </div>
          <button type="button" class="qr-icon-btn" onclick="openQR(event, ${i})" title="QR 코드 보기">QR</button>
        </div>
        <p class="card-desc">${g.desc}</p>
        ${g.tip ? `<div class="card-tip"><b>이렇게 체험해 보세요</b>${g.tip}</div>` : ''}
        <div class="card-rank-bar" id="rank-bar-${g.id}">
          ${g.col
            ? `<span class="rank-who">🏆 오늘의 랭킹 도전 가능</span><span class="rank-val">RANK</span>`
            : `<span class="rank-who">${g.tagLabel || '✨ 자유 체험 웹앱'}</span><span class="rank-val" style="color:#2563eb">OPEN</span>`
          }
        </div>
      </div>
    </a>
  `;
}).join('');

function openQR(e, i) {
  e.preventDefault();
  e.stopPropagation();
  const g = GAMES[i];
  $('modalTitle').textContent = g.name;
  const box = $('modalQRBox');
  box.innerHTML = '';
  new QRCode(box, {
    text: fullUrl(g.url),
    width: 300,
    height: 300,
    colorDark: '#111827',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  $('qrModal').classList.add('open');
}

function closeModal() {
  $('qrModal').classList.remove('open');
}

let allQrMade = false;
function toggleAllQR() {
  if (!allQrMade) {
    allQrMade = true;
    GAMES.forEach((g, i) => {
      new QRCode($('inline-qr-' + i), {
        text: fullUrl(g.url),
        width: 240,
        height: 240,
        colorDark: '#111827',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  }
  const on = document.body.classList.toggle('qr-all');
  $('qrModeBtn').classList.toggle('active', on);
  $('qrModeBtn').innerHTML = on ? '<span>✕</span><span>QR 닫기</span>' : '<span>📱</span><span>전체 QR 코드</span>';
}

renderFilters();
try {
  const initTab = new URLSearchParams(location.search).get('tab');
  if (initTab && FILTERS.some(f => f[0] === initTab)) {
    setFilter(initTab);
  }
} catch (e) {}

// 실시간 랭킹 연동 (각 게임 카드 하단에 오늘 1위 표시)
const boards = {};
let gugudanRows = [];

function updateLiveRanks() {
  let totalPlays = 0;

  GAMES.forEach(g => {
    if (!g.col) return;
    const barEl = $('rank-bar-' + g.id);
    if (!barEl) return;

    if (g.col === 'gugudan') {
      totalPlays += gugudanRows.length;
      if (gugudanRows.length > 0) {
        const top = gugudanRows[0];
        barEl.innerHTML = `<span class="rank-who">🥇 1위 <b>${esc(top.nickname)}</b> (${gugudanRows.length}명 도전)</span><span class="rank-val">${g.fmtScore(top)}</span>`;
      }
      return;
    }

    const b = boards[g.col];
    if (!b) return;
    let rows = b.today();
    if (g.filterFn) rows = rows.filter(g.filterFn);
    totalPlays += rows.length;

    if (rows.length > 0) {
      const top = [...rows].sort(g.sortFn)[0];
      barEl.innerHTML = `<span class="rank-who">🥇 1위 <b>${esc(top.name)}</b> (${rows.length}명 도전)</span><span class="rank-val">${g.fmtScore(top)}</span>`;
    } else {
      barEl.innerHTML = `<span class="rank-who">🏆 오늘 첫 1등에 도전해 보세요!</span><span class="rank-val">NEW</span>`;
    }
  });

  $('todayTotalPlays').textContent = totalPlays.toLocaleString('ko-KR');
}

if (typeof createBoard === 'function') {
  GAMES.forEach(g => {
    if (g.col && g.col !== 'gugudan') {
      const b = createBoard(g.col);
      boards[g.col] = b;
      b.onChange(updateLiveRanks);
      b.init();
    }
  });
}

async function fetchGugudan() {
  for (const u of ['./api/gugudan-leaderboard', 'https://261123-gugudan-guardians.vercel.app/api/leaderboard?scope=global&mode=normal&period=today&limit=10']) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      if (Array.isArray(j.records)) {
        gugudanRows = j.records;
        updateLiveRanks();
        return;
      }
    } catch (e) {}
  }
}
fetchGugudan();
setInterval(fetchGugudan, 20000);
</script>
